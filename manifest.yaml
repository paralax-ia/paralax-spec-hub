version: "1.0"
project: "paralax-ia"
description: "Catálogo de repositórios oficiais e governança de especificações do ecossistema Paralax IA"

# ── Declaração Declarativa de Nuvem e Observabilidade ─────────────────────────
cloud_environments:
  production:
    provider: "gcp"
    project_id: "paralax-prod"
    project_number: "847291039482"
    region: "us-central1"
    access_mode: "direct-api"

    kubernetes:
      cluster_name: "prod-gke-cluster"
      namespace: "prod"
      sidecar_proxy:
        container_name: "envoy-sidecar"
        port: 5000

    wif:
      pool_id: "github-pool-prod"
      provider_id: "github-provider"
      service_account_email: "prod-github-actions-sa@paralax-prod.iam.gserviceaccount.com"
      issuer_uri: "https://token.actions.githubusercontent.com"

    logging:
      default_resource_type: "k8s_container"
      severity_threshold: "ERROR"
      trace_correlation_field: "jsonPayload.trace_id"
      default_window: "2h"
      max_entries: 50

repositories:
  # Bibliotecas Compartilhadas (Camada Base)
  - name: "paralax-agents-common"
    repo: "paralax-ia/paralax-agents-common"
    role: "shared-library"
    language: "python"
    package_type: "wheel"
    depends_on: []
    release_strategy: "semver"
    auto_release: true

  - name: "paralax-evo-crm"
    repo: "paralax-ia/paralax-evo-crm"
    role: "sdk"
    language: "python"
    package_type: "wheel"
    depends_on:
      - "paralax-agents-common"
    release_strategy: "semver"
    auto_release: true

  # Agentes de IA (Consumidores)
  - name: "customer-support-vehicles"
    repo: "paralax-ia/customer-support-vehicles"
    role: "ai-agent"
    language: "python"
    entrypoint: "vehicles"
    dockerfile: "Dockerfile"
    depends_on:
      - "paralax-evo-crm"
      - "paralax-agents-common"
    release_strategy: "semver"
    deploy_target: "production"

  - name: "duo-dermato-support"
    repo: "paralax-ia/duo-dermato-support"
    role: "ai-agent"
    language: "python"
    entrypoint: "duo_dermato"
    dockerfile: "Dockerfile"
    depends_on:
      - "paralax-evo-crm"
      - "paralax-agents-common"
    release_strategy: "semver"
    deploy_target: "production"

  - name: "google-calendar-agent"
    repo: "paralax-ia/google-calendar-agent"
    role: "a2a-agent"
    language: "python"
    entrypoint: "google_calendar"
    dockerfile: "Dockerfile"
    depends_on:
      - "paralax-agents-common"
    release_strategy: "semver"
    deploy_target: "production"

  - name: "paralax-support"
    repo: "paralax-ia/paralax-support"
    role: "ai-agent"
    language: "python"
    entrypoint: "support"
    dockerfile: "Dockerfile"
    depends_on:
      - "paralax-evo-crm"
      - "paralax-agents-common"
    release_strategy: "semver"
    deploy_target: "production"

  - name: "anero-cafe-support"
    repo: "paralax-ia/anero-cafe-support"
    role: "ai-agent"
    language: "python"
    entrypoint: "anero_cafe"
    dockerfile: "Dockerfile"
    depends_on:
      - "paralax-evo-crm"
      - "paralax-agents-common"
    release_strategy: "semver"
    deploy_target: "production"

  # Plataforma de Canais e Mensageria
  - name: "evo-bot-runtime"
    repo: "paralax-ia/evo-bot-runtime"
    role: "orchestrator"
    language: "go"
    dockerfile: "Dockerfile"
    depends_on: []
    release_strategy: "semver"
    deploy_target: "production"

  # CRM Core
  - name: "evo-ai-crm-community"
    repo: "paralax-ia/evo-ai-crm-community"
    role: "crm-backend"
    language: "ruby"
    dockerfile: "Dockerfile"
    depends_on: []
    release_strategy: "semver"
    deploy_target: "production"

  # Plataforma de CI/CD e Workflows Reutilizáveis
  - name: "actions-workflows"
    repo: "paralax-ia/actions-workflows"
    role: "ci-cd-platform"
    language: "yaml"
    package_type: "reusable-workflows"
    depends_on: []
    release_strategy: "semver"
    deploy_target: "production"


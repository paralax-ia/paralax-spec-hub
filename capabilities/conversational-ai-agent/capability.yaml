version: '1.0'
capability_id: conversational-ai-agent
name: Orquestração Conversacional e Resiliência de Agentes de IA
subdomain_type: core
scope: platform
supported_products:
- paralax-platform
- customer-support-vehicles
- duo-dermato-support
- anero-cafe-support
- paralax-support
description: Habilidade central de engajamento conversacional dos agentes de IA, cobrindo
  fallback dinâmico de modelos, observabilidade via tracing (Langfuse), heartbeat
  de progresso em chamadas lentas e gestão de estado de sessão.
ubiquitous_language:
  AgentBot: Entidade autônoma de IA que responde conversas no CRM via ADK.
  FallbackModel: Modelo reserva invocado em caso de esgotamento transitório (429/503).
  Heartbeat: Mensagem intermediária de progresso enviada durante execuções prolongadas.
  SessionState: Estado persistente de contexto conversacional e memória do agente.
  TraceContext: Identificador distribuído para correlação e observabilidade no Langfuse.
context_map:
  upstream_authoritative: google-antigravity-adk
  sdk_layer: paralax-agents-common
  downstream_consumers:
  - customer-support-vehicles
  - duo-dermato-support
  - paralax-support
  - anero-cafe-support

name: paralax-agents-common
role: shared-library
language: python
description: Capacidades computacionais de paralax-agents-common
classes:
- name: PrivacyMaskingSpanProcessor
  docstring: 'An OpenTelemetry SpanProcessor that scrubs sensitive attributes.


    This processor replaces the values of any span attributes that look like

    inputs, outputs, messages, prompts, or content with a masked string to

    prevent PII leakage to the observability platform.'
  methods:
  - name: on_start
    docstring: Called when a span is started.
  - name: on_end
    docstring: Called when a span is ended. Scrubs sensitive attributes.
- name: CodeBlockReplacer
  docstring: Helper class to replace and restore markdown code blocks.
  methods:
  - name: save_code
    docstring: Saves a matched code block and returns a placeholder string.
functions:
- name: is_configured
  docstring: Return True if the minimum Langfuse env vars are present.
- name: setup_tracing
  docstring: 'Initialise Langfuse and OpenTelemetry.


    Safe to call multiple times – subsequent calls are no-ops.'
- name: get_langfuse
  docstring: Return the initialised Langfuse client, or None if not configured.
- name: flush_tracing
  docstring: Flushes Langfuse traces to ensure they are sent before process exit.
- name: safe_detach
  docstring: ''
- name: rate_limit_callback
  docstring: "Callback function that implements a query rate limit.\n\nArgs:\n   \
    \ callback_context: The context of the callback invocation.\n    llm_request:\
    \ The current LLM request."
- name: check_inbox_business_hours
  docstring: '[DEPRECATED] Esta função foi movida para as callbacks do CRM.

    Atualize o frontend importando `from paralax.evo.crm.callbacks import check_inbox_business_hours`.

    Ela executa o import de forma dinâmica para blindar retrocompatibilidade do Common.'
- name: propagate_langfuse_attributes
  docstring: "Propagates the current session ID and attributes to the Langfuse client.\n\
    \nArgs:\n    invocation_context: The context of the current agent invocation."
- name: safe_tool
  docstring: "Decorator para envolver ferramentas do ADK, prevenindo que exceções\
    \ não tratadas vazem\npara o orquestrador (e para o cliente). Quando uma falha\
    \ ocorre, retorna uma string \ninformativa para que o LLM possa tratá-la graciosamente.\n\
    \nArgs:\n    func (Callable): A função a ser decorada.\n\nReturns:\n    Callable:\
    \ A função decorada que captura exceções e retorna uma mensagem informativa."
- name: format_for_whatsapp
  docstring: "Compiles standard Markdown text into WhatsApp-compatible syntax.\n\n\
    Args:\n    llm_text: Raw text from the LLM (Markdown or pre-formatted WhatsApp\
    \ text).\n    max_chunk_size: Maximum characters per chunk (default 4096).\n \
    \   soft_limit: Soft limit to break paragraphs before they get too long (default\
    \ 300).\n\nReturns:\n    A list of WhatsApp-formatted text chunks."
- name: chunk_text
  docstring: "Splits text into chunks that fit within the effective limit.\n\nPrefers\
    \ splitting hierarchically by double newline (paragraphs), then single newline,\n\
    then looks for sentence terminators, then spaces, before hard-splitting.\n\nArgs:\n\
    \    text: The text to chunk.\n    max_chunk_size: Absolute maximum number of\
    \ characters per chunk.\n    soft_limit: The threshold at which we should preemptively\
    \ break (matches Go backend limit).\n\nReturns:\n    A list of text chunks."
routes: []

  - name: CrmParams
    methods: []
  - name: CrmRequest
    methods: []
  - name: CrmResponseResult
    methods: []
  - name: CrmResponse
    methods: []
  - name: HealthStatus
    methods: []
  - name: CRMAPIError
    methods: []
  - name: CRMSendMessageError
    methods: []
  - name: CRMAPIClient

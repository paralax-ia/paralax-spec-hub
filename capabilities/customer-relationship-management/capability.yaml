version: '1.0'
capability_id: customer-relationship-management
name: Gestão de Relacionamento com Clientes e Contatos (CRM)
subdomain_type: supporting
scope: platform
supported_products:
- paralax-platform
- customer-support-vehicles
- duo-dermato-support
- anero-cafe-support
- paralax-support
description: Capacidade corporativa responsável pela gestão de identidades de contatos,
  histórico de conversas, controle de expediente de atendimento e transbordo humano.
ubiquitous_language:
  Contact: Indivíduo identificado por telefone no padrão internacional E.164 e UUID
    corporativo.
  Conversation: Sessão de interação contínua entre um Contact e os canais de atendimento.
  Inbox: Canal e caixa de entrada associada a regras de negócio específicas.
  WorkingHours: Janela semanal de atendimento que define a disponibilidade de operadores.
  OutOfOffice: Condição de negócio em que a organização está fora do horário de expediente
    comercial.
  HealthStatus: Estado de conectividade e disponibilidade operacional do CRM.
context_map:
  upstream_authoritative: evo-ai-crm-community
  sdk_layer: paralax-evo-crm
  downstream_consumers:
  - customer-support-vehicles
  - duo-dermato-support
  - paralax-support
  - anero-cafe-support

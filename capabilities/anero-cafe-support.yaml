name: anero-cafe-support
role: ai-agent
language: python
description: Capacidades computacionais de anero-cafe-support
classes:
- name: AgentModel
  docstring: Agent model settings.
  methods: []
- name: Config
  docstring: Configuration settings for the Anero Cafe agent.
  methods: []
functions:
- name: graceful_model_error_handler
  docstring: 'Catches model runtime errors, logs the stack trace, and prevents raw
    exception

    leakage to the A2A streaming client by yielding a friendly fallback text.'
- name: create_root_agent
  docstring: Creates and returns the anero cafe support agent.
- name: get_random_headers
  docstring: "Returns HTTP headers mimicking a standard browser.\n\nReturns:\n   \
    \ Dict[str, str]: The headers dictionary."
- name: coffee_search
  docstring: "Pesquisa produtos no site do Anero Café.\n\nArgs:\n    query: O termo\
    \ de busca.\n\nReturns:\n    Um dicionário com os links dos produtos encontrados."
- name: get_coffee_details
  docstring: "Extrai detalhes de um produto de café a partir de sua URL.\n\nArgs:\n\
    \    url: A URL da página do produto.\n\nReturns:\n    Uma string formatada em\
    \ Markdown com os detalhes do produto."
- name: get_website_content
  docstring: Busca o conteúdo do site do Anero Café.
- name: before_model_callback
  docstring: Invoked before calling the underlying LLM.
- name: lowercase_value
  docstring: "Recursively converts strings in a dictionary, list, or tuple to lowercase.\n\
    \nArgs:\n    value: The value to convert.\n\nReturns:\n    The value with all\
    \ string elements converted to lowercase."
- name: before_tool
  docstring: "Invoked before executing a tool.\n\nArgs:\n    tool: The tool being\
    \ executed.\n    args: The arguments passed to the tool.\n    tool_context: The\
    \ context for the tool execution."
- name: after_tool
  docstring: "Invoked after executing a tool.\n\nArgs:\n    tool: The tool that was\
    \ executed.\n    args: The arguments passed to the tool.\n    tool_context: The\
    \ context for the tool execution.\n    tool_response: The response from the tool\
    \ execution.\n\nReturns:\n    An optional dictionary to modify the tool response."
- name: before_agent
  docstring: "Invoked before the agent processes a request.\n\nArgs:\n    callback_context:\
    \ The context for the agent invocation."
- name: run_crm
  docstring: "Webhook endpoint to handle incoming messages from the CRM.\n\nValidates\
    \ the payload, manages Redis session mapping between the CRM context\nand the\
    \ Vertex AI session, invokes the agent response generator, and\nasynchronously\
    \ saves the conversational memory.\n\nArgs:\n    request: The incoming CRM JSON-RPC\
    \ request.\n    \nReturns:\n    A JSON-RPC response dict formatted for the CRM."
routes: []

version: '1.0'
capability_id: ci-cd-orchestration
name: Orquestração de Entrega Contínua e Pipelines de CI/CD
subdomain_type: generic
scope: platform
supported_products:
- paralax-platform
- customer-support-vehicles
- duo-dermato-support
- anero-cafe-support
- paralax-support
description: Capacidade corporativa de orquestração de esteiras de integração contínua
  (CI), automação de testes, build de contêineres, publicação de pacotes wheel privados
  e entrega contínua (CD) em ambientes GCP/GKE via workflows reutilizáveis e Google
  Cloud Build sob política estrita de fail-fast.
ubiquitous_language:
  ReusableWorkflow: Workflow centralizado do GitHub Actions consumido via workflow_call
    por múltiplos repositórios.
  FailFast: Política estrita onde qualquer falha ou erro encerra imediatamente a esteira,
    sendo proibido mascaramento silencioso sem justificativa formal.
  WorkloadIdentityFederation: Mecanismo de autenticação federada (WIF) entre runners
    do GitHub e GCP sem chaves estáticas.
  CloudBuildStep: Etapa isolada e reproduzível de compilação, teste ou publicação
    executada em runners do Cloud Build.
  VendorWheels: Pacotes de distribuição binária compartilhados e injetados dinamicamente
    nos pipelines de agentes de IA.
  GitOpsSync: Atualização declarativa automatizada de imagens e tags nos manifestos
    do repositório ArgoCD.
context_map:
  upstream_authoritative: actions-workflows
  sdk_layer: actions-workflows
  downstream_consumers:
  - paralax-agents-common
  - paralax-evo-crm
  - customer-support-vehicles
  - duo-dermato-support
  - google-calendar-agent
  - paralax-support
  - anero-cafe-support
  - paralax-site
specs: []
runtime_contracts: {}

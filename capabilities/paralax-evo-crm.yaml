name: paralax-evo-crm
role: sdk
language: python
description: Capacidades computacionais de paralax-evo-crm
classes:
- name: CrmMessagePart
  docstring: Represents a single part of a message in the CRM payload (e.g., text,
    image).
  methods: []
- name: CrmMessage
  docstring: Represents a complete message sent from the CRM.
  methods:
  - name: get_text
    docstring: Concatenates the text from all parts where text is not None.
- name: CrmParams
  docstring: Parameters included in a CRM webhook request.
  methods: []
- name: CrmRequest
  docstring: The JSON-RPC request structure received from the CRM webhook.
  methods: []
- name: CrmResponseResult
  docstring: ''
  methods: []
- name: CrmResponse
  docstring: JSON-RPC response structure sent back to the CRM.
  methods: []
- name: HealthStatus
  docstring: Modelo de status de saúde e conectividade do CRM.
  methods: []
- name: CRMAPIError
  docstring: Base exception for CRM API errors.
  methods: []
- name: CRMSendMessageError
  docstring: Raised when sending a message fails.
  methods: []
- name: CRMAPIClient
  docstring: Client for interacting with the CRM API via private VPC route.
  methods:
  - name: send_message
    docstring: "Sends a message to a conversation.\n\nArgs:\n    context_id: The context\
      \ ID of the conversation.\n    text: The text content of the message.\n    sender_id:\
      \ The ID of the sender.\n    sender_type: The type of the sender. Defaults to\
      \ \"AgentBot\"."
  - name: toggle_conversation_status
    docstring: "Toggles the status of a conversation (e.g. to 'open' for handoff).\n\
      \nArgs:\n    context_id: The context ID of the conversation.\n    status: The\
      \ status to set.\n    \nReturns:\n    A dictionary containing the response JSON."
  - name: get_conversation_sync
    docstring: "Fetches a conversation by its UUID or ID (synchronously).\n\nArgs:\n\
      \    context_id: The context ID of the conversation.\n    \nReturns:\n    A\
      \ dictionary containing the conversation data."
  - name: get_inbox_sync
    docstring: "Fetches an inbox by its ID (synchronously).\n\nArgs:\n    inbox_id:\
      \ The ID of the inbox.\n    \nReturns:\n    A dictionary containing the inbox\
      \ data."
  - name: get_schedule_summary
    docstring: "Generates a summary of the working hours.\n\nArgs:\n    working_hours:\
      \ A list of dictionaries containing working hours data.\n    \nReturns:\n  \
      \  A string summarizing the schedule."
  - name: check_out_of_office
    docstring: "Checks if the current time is outside the inbox's working hours.\n\
      \nArgs:\n    inbox_data: The inbox data containing working hours configuration.\n\
      \    \nReturns:\n    A tuple containing:\n        - is_out_of_office: True if\
      \ currently outside working hours.\n        - current_time_str: The current\
      \ time formatted as a string.\n        - schedule_summary_str: A summary of\
      \ the working schedule."
  - name: health_check
    docstring: "Verifica a conectividade e integridade da API do CRM.\n\nReturns:\n\
      \    Instância de HealthStatus com status, versão e timestamp.\n\nRaises:\n\
      \    CRMAPIError: Se houver falha de rede ou resposta não saudável do CRM."
functions:
- name: request_human_handoff
  docstring: "Performs a handoff to a human agent if the user explicitly requests\
    \ to speak with\nan agent, human, or person, or if the conversation exhausts its\
    \ response\nalternatives. This function transfers the conversation in the CRM.\n\
    \nArgs:\n    reason: The reason why the handoff was requested.\n    crm_api: The\
    \ CRMAPIClient instance.\n    config: The configuration object for Redis host,\
    \ ports, etc.\n\nReturns:\n    A dictionary containing the result of the handoff\
    \ operation."
- name: run_agent_once
  docstring: "Executes a single agent run within the timeout, managing the heartbeat\
    \ task.\n\nArgs:\n    runner: The ADK Runner instance.\n    user_id: The ID of\
    \ the user.\n    vertex_session_id: The ADK Session ID.\n    content: The user's\
    \ message content to pass to the agent.\n    context_id: The CRM context ID.\n\
    \    timeout_seconds: Max seconds to wait for LLM response before timeout.\n \
    \   crm_client: The CRM API Client instance.\n    enable_heartbeat: Whether to\
    \ send heartbeat messages on tool calls.\n    heartbeat_messages: List of heartbeat\
    \ messages.\n    agent_bot_id_str: CRM bot ID string for heartbeat, if available.\n\
    \nReturns:\n    The concatenated text from the agent response.\n\nRaises:\n  \
    \  TimeoutError: If the agent exceeds timeout_seconds.\n    ServerError: On internal\
    \ LLM provider errors (e.g. 500).\n    ServiceUnavailable: On LLM provider unavailability\
    \ (e.g. 503).\n    ResourceExhausted: On LLM quota exhaustion (e.g. 429)."
- name: generate_crm_response
  docstring: "Generates a response from the CRM agent runner with retry and model\
    \ fallback.\n\nHandles session mapping, timeouts, session recreation on SessionNotFoundError,\n\
    and retries with fallback models on transient LLM provider errors.\nThe heartbeat\
    \ feature is disabled by default.\n\nArgs:\n    runner: The ADK Runner instance.\n\
    \    session_service: The ADK Session Service instance.\n    user_id: The ID of\
    \ the user.\n    vertex_session_id: The ADK Session ID.\n    content: The user's\
    \ message content to pass to the agent.\n    context_id: The CRM context ID.\n\
    \    use_redis_mapping: Boolean indicating if Redis is used for mapping.\n   \
    \ timeout_seconds: Max seconds to wait for LLM response before timeout.\n    crm_client:\
    \ The CRM API Client instance.\n    heartbeat_messages: List of heartbeat messages.\n\
    \    enable_heartbeat: If True, sends heartbeat messages on tool calls.\n    \
    \    Defaults to False.\n    fallback_models: Ordered list of model names to try\
    \ after a transient\n        provider error. The primary model is always attempted\
    \ first.\n        Defaults to None (no fallback).\n    redis_client: Redis client\
    \ instance if use_redis_mapping is True.\n\nReturns:\n    A tuple of (final_text,\
    \ vertex_session_id)."
- name: send_heartbeats
  docstring: "Sends periodic messages using exponential backoff to avoid chat saturation.\n\
    \nArgs:\n    context_id: CRM conversation context ID.\n    agent_bot_id: CRM bot\
    \ ID.\n    stop_event: Event to stop the heartbeat loop.\n    crm_client: The\
    \ CRM API Client instance.\n    messages: List of heartbeat messages to send."
- name: attach_crm_webhook
  docstring: "Mounts the CRM webhook router to the FastAPI app.\n\nIf 'register_in_crm'\
    \ is False, the CRM webhook is not mounted, allowing\nA2A-only operation without\
    \ needing CRM callbacks or registration.\n\nArgs:\n    app: The FastAPI application\
    \ instance.\n    agent_dir: The agent's base directory.\n    config: The agent\
    \ configuration object.\n    root_agent: The root ADK agent instance.\n    register_in_crm:\
    \ If False, the webhook is not mounted (A2A-only mode).\n    prefix: URL prefix\
    \ for the CRM router.\n    enable_heartbeat: If True, sends heartbeat messages\
    \ during tool calls.\n        Defaults to False.\n    fallback_models: Ordered\
    \ list of model names to try on transient provider\n        errors. Defaults to\
    \ None (no fallback)."
- name: check_inbox_business_hours
  docstring: "Verifica e salva o status de horário comercial na sessão usando a API\
    \ síncrona.\n\nArgs:\n    session_state: The dictionary containing the current\
    \ session state.\n    vertex_session_id: The ID of the current vertex session.\n\
    \    crm_api: An instance of CRMAPIClient to query inbox status.\n    redis_client:\
    \ An optional Redis client to resolve session mapping."
routes: []

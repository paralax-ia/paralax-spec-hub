version: '1.0'
capability_id: omnichannel-messaging
name: Mensageria Omnichannel e Roteamento WhatsApp
subdomain_type: core
scope: platform
supported_products:
- paralax-platform
- customer-support-vehicles
- duo-dermato-support
- anero-cafe-support
- paralax-support
description: Capacidade de conexão a instâncias de WhatsApp, recepção de webhooks
  em tempo real, debouncing de mensagens rápidas e despacho de eventos para o runtime
  de bots.
ubiquitous_language:
  Instance: Conexão ativa de WhatsApp vinculada a um QR Code e número telefônico.
  InboundWebhook: Payload HTTP enviado pela Evolution API contendo evento de mensagem
    recebida.
  DebounceWindow: Intervalo temporal para agrupar rajadas de mensagens consecutivas
    de um mesmo usuário.
  DispatchPipeline: Pipeline de despacho que encaminha mensagens para os agentes de
    atendimento adequados.
context_map:
  upstream_authoritative: evolution-api
  sdk_layer: evo-bot-runtime
  downstream_consumers:
  - evo-ai-crm-community
  - customer-support-vehicles
  - duo-dermato-support
  - paralax-support
specs: []
runtime_contracts:
  classes:
  - name: Violation
    methods: []
  - name: AstSensor
    methods:
    - add_violation
    - visit_function
    - visit_FunctionDef
    - visit_AsyncFunctionDef
    - visit_ClassDef
    - visit_Raise
  - name: CICDViolation
    methods:
    - format_output
  - name: CICDValidator
    methods:
    - find_target_files
    - validate_file
    - check_line_rules
    - run
  - name: RoutingResult
    methods:
    - to_dict
  - name: Diagnostic
    methods:
    - key
  - name: Comparison
    methods: []

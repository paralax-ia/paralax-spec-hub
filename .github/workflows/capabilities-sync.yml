name: Business Capabilities Continuous Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  sync:
    name: Sincronizar Business Capabilities (DDD)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Spec Hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Agentic Flywheel
        uses: actions/checkout@v4
        with:
          repository: 'eduardosan/agentic-flywheel'
          path: '.flywheel_src'
          ref: 'main'
          token: ${{ secrets.FLYWHEEL_DISPATCH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar uv
        run: pip install uv

      - name: Sincronizar Dependências do Flywheel (uv.lock canônico)
        run: uv sync --frozen --project .flywheel_src

      - name: Executar Auditoria e Sincronização via Harness State
        run: |
          uv run --project .flywheel_src --frozen python -m harness_state.capabilities audit --spec-hub-dir .
          uv run --project .flywheel_src --frozen python -m harness_state.capabilities sync --spec-hub-dir .

      - name: Verificar se há alterações nos contratos
        id: git-check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain capabilities/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar Token de Instalação da GitHub App (se secrets disponíveis)
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Criar Pull Request se houver Drift de Contratos
        if: steps.git-check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          commit-message: "chore(capabilities): automated sync of runtime contracts"
          branch: "chore/automated-capabilities-sync"
          title: "chore(capabilities): sincronização automática de contratos de runtime"
          body: |
            ## Sincronização Automática de Business Capabilities (DDD)
            Detectadas alterações nos contratos e classes implementadas nos repositórios.
            Este PR atualiza `capabilities/*/capability.yaml` com o estado real do código.
          labels: "capabilities, automated-pr"

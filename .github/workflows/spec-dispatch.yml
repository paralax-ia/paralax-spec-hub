name: Spec Fan-Out & Branch Orchestrator

on:
  pull_request:
    types: [opened, synchronize, labeled]
    paths:
      - 'specs/**'
  workflow_dispatch:
    inputs:
      spec_path:
        description: 'Caminho relativo da spec a processar (ex: specs/SPEC-001-crm-healthcheck.md)'
        required: true
        default: 'specs/SPEC-001-crm-healthcheck.md'
        type: string
      hub_pr_number:
        description: 'Número do PR da spec no hub para comentar o checklist (opcional)'
        required: false
        type: string
      dry_run:
        description: 'Executar em modo dry-run (apenas simulação)?'
        required: false
        default: false
        type: boolean

env:
  HARNESS_REDIS_HOST: ${{ vars.HARNESS_REDIS_HOST || '127.0.0.1' }}
  HARNESS_REDIS_PORT: ${{ vars.HARNESS_REDIS_PORT || '6379' }}
  ES_INTERNAL_URL: ${{ vars.ES_INTERNAL_URL || 'http://127.0.0.1:9200' }}
  ES_EXTERNAL_URL: ${{ vars.ES_EXTERNAL_URL || 'https://es.eduardosan.com:443' }}
  ES_INDEX: ${{ vars.ES_INDEX || 'harness-sensor-telemetry' }}
  LLM_INTERNAL_BASE_URL: ${{ vars.LLM_INTERNAL_BASE_URL || 'http://127.0.0.1:11434/v1' }}
  LLM_EXTERNAL_BASE_URL: ${{ vars.LLM_EXTERNAL_BASE_URL || 'https://ollama.eduardosan.com/v1' }}
  LLM_DEFAULT_MODEL: ${{ vars.LLM_DEFAULT_MODEL || 'agentic-qwen:7b' }}
  LLM_JUDGE_MODEL: ${{ vars.LLM_JUDGE_MODEL || 'agentic-qwen' }}
  SPEC_HUB_ORG: ${{ vars.SPEC_HUB_ORG || 'paralax-ia' }}
  SPEC_HUB_REPO: ${{ vars.SPEC_HUB_REPO || 'paralax-ia/paralax-spec-hub' }}
  FLYWHEEL_REPO: ${{ vars.FLYWHEEL_REPO || 'eduardosan/agentic-flywheel' }}

jobs:
  fanout:
    name: "Executar Fan-Out e Abertura de Branches"
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        github.event.action == 'opened' ||
        github.event.action == 'synchronize' ||
        contains(github.event.pull_request.labels.*.name, 'spec-ready')
      ))
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Spec Hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Agentic Flywheel
        uses: actions/checkout@v4
        with:
          repository: 'eduardosan/agentic-flywheel'
          path: '.flywheel_src'
          ref: 'main'
          token: ${{ secrets.FLYWHEEL_DISPATCH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar uv
        run: pip install uv

      - name: Sincronizar Dependências do Flywheel (uv.lock canônico)
        run: uv sync --frozen --project .flywheel_src

      - name: Gerar Token de Instalação da GitHub App (se secrets disponíveis)
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Determinar Parâmetros de Execução
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SPEC_FILE="${{ inputs.spec_path }}"
            PR_NUM="${{ inputs.hub_pr_number }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            SPEC_FILE=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^specs/SPEC-[^/]+\.md$' | head -n 1)
            if [ -z "$SPEC_FILE" ]; then
              SPEC_FILE=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^specs/[^/]+\.md$' | head -n 1)
            fi
            PR_NUM="${{ github.event.pull_request.number }}"
            DRY_RUN="false"
          fi

          if [ -z "$SPEC_FILE" ]; then
            echo "Nenhum arquivo de spec modificado encontrado."
            exit 0
          fi

          if grep -qiE "^status:\s*(MERGED|ARCHIVED|CLOSED)" "$SPEC_FILE" 2>/dev/null; then
            echo "Spec $SPEC_FILE possui status MERGED/ARCHIVED/CLOSED. Fan-out ignorado para specs já finalizadas."
            exit 0
          fi

          echo "spec_file=$SPEC_FILE" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Configurar Ambiente CI do Harness
        run: uv run --project .flywheel_src harness setup --ci

      - name: Executar Fan-Out nos Repositórios Spokes
        if: steps.params.outputs.spec_file != ''
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCH_TOKEN: ${{ secrets.FLYWHEEL_DISPATCH_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            export GH_TOKEN="$APP_TOKEN"
          elif [ -n "$DISPATCH_TOKEN" ]; then
            export GH_TOKEN="$DISPATCH_TOKEN"
          else
            export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi

          echo "Verificando autenticação no GitHub CLI:"
          gh auth status || true

          uv run --project .flywheel_src harness spec plan \
            --spec "${{ steps.params.outputs.spec_file }}" \
            --manifest manifest.yaml
